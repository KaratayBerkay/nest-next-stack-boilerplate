# Fluent Bit: receives both frontend and backend logs via Docker fluentd log driver.
# Routed by SOURCE (mobile / web / backend), not by category — mobile-logs, web-logs,
# and backend-logs each hold every category mixed together. The old category-based
# indices (session-logs, page-logs, etc.) are frozen: they keep their historical data
# but no longer receive new writes as of this routing change.
[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

# Receive logs from all containers via Docker fluentd log driver.
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# Docker's fluentd log driver wraps each stdout line as a raw JSON *string* under
# `log` (plus container_id/container_name/source) rather than parsing it — so every
# Pino field (level, category, event, userId, ...) starts out trapped inside that
# string, invisible to any later filter/rule that reads a top-level key. Decode it
# back into real fields using the pino_json parser (parsers.conf) before anything
# downstream tries to read record fields.
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        pino_json
    Reserve_Data  On
    Preserve_Key  Off

# Pino emits a numeric `level` (30=info, 50=error). Add a human-readable label for Kibana.
[FILTER]
    Name      lua
    Match     *
    Script    /fluent-bit/etc/level_name.lua
    Call      add_level_name

# Tag backend records with the service name.
[FILTER]
    Name      modify
    Match     app*
    Add       service nest-boilerplate

# Tag frontend records with the service name.
[FILTER]
    Name      modify
    Match     frontend*
    Add       service next-js-boilerplate

# Split the backend (app*) stream by source: ActivityLogService (Flutter's only
# path into this backend, since mobile has no server of its own) stamps every
# event it logs with `origin: "mobile"`; everything else the app logs on its
# own (session, exceptions, database, performance, payment, billing, rate
# limiting, ...) has no such field.
# NOTE: the marker field is named `origin`, not `source` — Docker's fluentd
# log driver already injects its own top-level `source` field (stdout/stderr)
# into every record, which collides with and silently wins over a same-named
# field from the application payload.
# Deliberately two SEPARATE filter blocks, not one filter with two Rule lines —
# multiple Rule lines in a single rewrite_tag filter did not behave as
# first-match-wins in testing (every app* record ended up on the catch-all
# rule regardless of whether an earlier rule also matched). Two sequential
# filters rely only on ordinary filter chaining instead: filter 1 consumes
# (Keep=false) anything with origin=mobile, re-tagging it; only records that
# did NOT match filter 1 are still tagged app* by the time filter 2 runs, so
# its catch-all only ever sees genuine backend-internal records.
[FILTER]
    Name          rewrite_tag
    Match         app*
    Rule          $origin ^(mobile)$ mobile false
    Emitter_Name  re_emit_app_mobile

[FILTER]
    Name          rewrite_tag
    Match         app*
    Rule          $service ^(.*)$ backend false
    Emitter_Name  re_emit_app_backend

[OUTPUT]
    Name                es
    Match               mobile
    Host                elasticsearch
    Port                9200
    Index               mobile-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False

[OUTPUT]
    Name                es
    Match               backend
    Host                elasticsearch
    Port                9200
    Index               backend-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False

# Every frontend* record is web by definition — Next.js only ever serves the
# browser app, so no per-record splitting is needed the way app* required.
[OUTPUT]
    Name                es
    Match               frontend*
    Host                elasticsearch
    Port                9200
    Index               web-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False

# Messaging/WS gateway activity is backend-internal too — folds into the same
# backend-logs index rather than keeping its own separate messaging-logs.
[OUTPUT]
    Name                es
    Match               messaging-ws*
    Host                elasticsearch
    Port                9200
    Index               backend-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
