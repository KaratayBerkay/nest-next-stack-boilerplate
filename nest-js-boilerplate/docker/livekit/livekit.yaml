port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # The compose service binds to the host network via container ports below,
  # but LiveKit itself needs to know its own reachable address to hand out
  # to clients in ICE candidates. When false, LiveKit uses its auto-detected
  # local IP — works for localhost-only dev. For production or LAN testing
  # with real devices, set to true and provide node_ip with the host's real
  # LAN/public IP so clients receive routable ICE candidates.
  use_external_ip: false
  # network_mode: host means LiveKit sees every host interface — including
  # the docker bridges (docker0 + per-compose br-* at 172.17-19.0.1). Those
  # addresses are unreachable for every real client, yet they were being
  # advertised as ICE candidates, producing constant "ice reconnected or
  # switched pair" flapping across the four interfaces during live calls.
  # Only advertise addresses a client could actually route to.
  ips:
    excludes: ["172.16.0.0/12"]
# livekit runs with network_mode: host (see docker-compose.yml), so it has
# no Docker-internal DNS — every other service must be addressed via
# localhost + its published host port, not its compose service name.
redis:
  address: localhost:6379
# Dev-only static key pair — matches LIVEKIT_API_KEY/LIVEKIT_API_SECRET in
# .vault-envs/backend.env. LiveKit requires secrets >= 32 chars. Rotate via
# Vault for any non-local deployment.
keys:
  devkey: mv7UGPhgFgSTNoNaA3Pq2V4QLG6Q9wB6
webhook:
  api_key: devkey
  # No global route prefix in this app (see main.ts) — RtcWebhookController's
  # @Controller('rtc/webhook') resolves to /rtc/webhook/livekit, not
  # /api/rtc/webhook/livekit.
  urls:
    - http://localhost:3000/rtc/webhook/livekit
